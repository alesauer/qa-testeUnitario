<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Login QA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded shadow-md w-80">
    <h1 class="text-xl font-bold mb-4 text-center">Sistema Login QA</h1>
    
    <!-- Mensagens de erro/sucesso -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="bg-red-100 text-red-700 p-2 rounded mb-4 text-sm text-center">
            {{ msg }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label class="block text-sm mb-1 text-gray-700">Usuário</label>
        <input type="text" name="usuario" required class="w-full border p-2 rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm mb-1 text-gray-700">Senha</label>
        <input type="password" name="senha" required class="w-full border p-2 rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition">
        Entrar
      </button>
    </form>
  </div>
</body>
</html>
