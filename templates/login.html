<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Login QA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded shadow-md w-80">
    <h1 class="text-xl font-bold mb-4 text-center">Sistema Login QA</h1>
    
    <!-- Mensagens de erro/sucesso -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="bg-red-100 text-red-700 p-2 rounded mb-4 text-sm text-center">
            {{ msg }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label class="block text-sm mb-1 text-gray-700">Usuário</label>
        <input type="text" name="usuario" required class="w-full border p-2 rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm mb-1 text-gray-700">Senha</label>
        <input type="password" name="senha" required class="w-full border p-2 rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white font-medium p-2.5 rounded-lg hover:bg-blue-700 transition duration-150 shadow-sm">
        Entrar
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-gray-100 text-center">
      <a href="/documentacao" class="inline-flex items-center text-sm font-medium text-blue-600 hover:text-blue-800 hover:underline gap-1.5 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
        📖 Documentação & Laboratório QA
      </a>
    </div>
  </div>
</body>
</html>
